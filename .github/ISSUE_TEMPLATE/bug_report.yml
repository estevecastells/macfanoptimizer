name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are triaged once a week.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: model
    attributes:
      label: Mac model and macOS version
      description: "`sysctl -n hw.model` and `sw_vers -productVersion`"
      placeholder: Mac17,9 / 26.6
    validations: { required: true }
  - type: textarea
    id: status
    attributes:
      label: "`fanctl status` output"
      render: text
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from /var/log/macfanoptimizer.log
      render: text
  - type: checkboxes
    id: conflicts
    attributes:
      label: Checks
      options:
        - label: No other fan-control app (Macs Fan Control, TG Pro, smcFanControl) is running
          required: true
