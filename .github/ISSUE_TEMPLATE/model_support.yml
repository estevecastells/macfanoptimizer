name: Hardware report (help validate a Mac model)
description: Tell us how MacFanOptimizer behaves on your Mac
labels: [model-support]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Every report helps move a Mac model from "compatible" to "validated".
        `fanctl report` only **reads** the SMC; it never changes your fans. Run it with the daemon installed,
        ideally after a few minutes of use, so it includes the fan verification result.
  - type: dropdown
    id: outcome
    attributes:
      label: How did it go?
      options:
        - Works — fans follow temperature (and reach max under load)
        - Fans didn't respond / control was disabled
        - Monitoring only (no fans or not detected)
        - Something else (describe below)
    validations: { required: true }
  - type: textarea
    id: report
    attributes:
      label: "`fanctl report` output"
      description: "Run `fanctl report | pbcopy` and paste here."
      render: markdown
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Load test results, noises, odd behaviour after sleep, etc.
